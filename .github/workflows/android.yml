name: Compilar APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: APK de depuracion
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar la plataforma de compilacion
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      # Nombrar el fichero con el commit evita confundir dos descargas distintas
      # en la carpeta de Descargas del movil.
      - name: Etiquetar el APK con el commit
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/rutina-${GITHUB_SHA::7}.apk"
          ls -lh out

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: rutina-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90
